[project]
name = "backfill"
version = "0.3.0"
description = "Run background work within shared account capacity."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.43",
    "psycopg[binary]>=3.2.10",
]

[project.scripts]
backfill = "backfill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backfill"]

[tool.fastapi]
entrypoint = "backfill.main:app"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "FAST"]
